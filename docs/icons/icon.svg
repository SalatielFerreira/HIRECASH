<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#4338CA"/>
    </linearGradient>
  </defs>

  <!--
    Os PNGs são gerados por scripts/generate-icons.js a partir deste
    arquivo; ao mexer aqui, rode "npm run generate:icons" e commite os PNGs.
  -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- "S" da marca: fita curva formando um S, com dois pontos de acento
       nas pontas — mesmo traço do emblema da barra superior. -->
  <path d="M340 170 C200 170 200 256 270 256 C340 256 340 342 200 342"
        fill="none" stroke="#FFFFFF" stroke-width="54" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="388" cy="132" r="22" fill="#FFFFFF"/>
  <circle cx="152" cy="380" r="22" fill="#FFFFFF"/>
</svg>
