<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#4338CA"/>
    </linearGradient>
    <clipPath id="rounded">
      <rect width="512" height="512" rx="112"/>
    </clipPath>
  </defs>

  <!--
    Fundo de faixas curvas na diagonal, mesma ideia da barra superior do
    app: as faixas nao tem cor propria, sao so camadas de preto e branco
    translucidos sobre o gradiente roxo — e por isso saem como tons de
    roxo. Trocar a cor no gradiente muda o icone inteiro junto.

    Os PNGs sao gerados por scripts/generate-icons.js a partir deste
    arquivo; ao mexer aqui, rode "npm run generate:icons" e commite os PNGs.
  -->
  <g clip-path="url(#rounded)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <path d="M-620 0C-440 60,-290 300,-108 512H42C-140 300,-290 60,-470 0Z" fill="#000" opacity="0.2"/>
    <path d="M-470 0C-290 60,-140 300,42 512H262C80 300,-70 60,-250 0Z" fill="#000" opacity="0.09"/>
    <path d="M-250 0C-70 60,80 300,262 512H297C115 300,-35 60,-215 0Z" fill="#fff" opacity="0.13"/>
    <path d="M-215 0C-35 60,115 300,297 512H392C210 300,60 60,-120 0Z" fill="#000" opacity="0.05"/>
    <path d="M-120 0C60 60,210 300,392 512H417C235 300,85 60,-95 0Z" fill="#fff" opacity="0.16"/>
    <path d="M-95 0C85 60,235 300,417 512H542C360 300,210 60,30 0Z" fill="#000" opacity="0.13"/>
    <path d="M30 0C210 60,360 300,542 512H572C390 300,240 60,60 0Z" fill="#fff" opacity="0.1"/>
    <path d="M60 0C240 60,390 300,572 512H687C505 300,355 60,175 0Z" fill="#000" opacity="0.04"/>
    <path d="M175 0C355 60,505 300,687 512H717C535 300,385 60,205 0Z" fill="#fff" opacity="0.15"/>
    <path d="M205 0C385 60,535 300,717 512H842C660 300,510 60,330 0Z" fill="#000" opacity="0.15"/>
    <path d="M330 0C510 60,660 300,842 512H867C685 300,535 60,355 0Z" fill="#fff" opacity="0.12"/>
    <path d="M355 0C535 60,685 300,867 512H982C800 300,650 60,470 0Z" fill="#000" opacity="0.08"/>
    <path d="M470 0C650 60,800 300,982 512H1152C970 300,820 60,640 0Z" fill="#000" opacity="0.24"/>
    <path d="M120 0C-60 60,-210 300,-392 512H-52C130 300,280 60,460 0Z" fill="#fff" opacity="0.05"/>
    <path d="M700 0C520 60,370 300,188 512H388C570 300,720 60,900 0Z" fill="#000" opacity="0.06"/>
    <path d="M1080 0C900 60,750 300,568 512H888C1070 300,1220 60,1400 0Z" fill="#fff" opacity="0.04"/>
  </g>

  <!-- Maleta (hire) -->
  <path d="M176 208h160a24 24 0 0 1 24 24v128a24 24 0 0 1-24 24H176a24 24 0 0 1-24-24V232a24 24 0 0 1 24-24z"
        fill="none" stroke="#FFFFFF" stroke-width="18" stroke-linejoin="round"/>
  <path d="M208 208v-16a24 24 0 0 1 24-24h48a24 24 0 0 1 24 24v16"
        fill="none" stroke="#FFFFFF" stroke-width="18" stroke-linejoin="round"/>
  <line x1="152" y1="272" x2="360" y2="272" stroke="#FFFFFF" stroke-width="18"/>

  <!-- Moeda (cash) -->
  <circle cx="256" cy="272" r="34" fill="#10B981" stroke="#FFFFFF" stroke-width="10"/>
  <text x="256" y="283" font-family="Arial, sans-serif" font-size="34" font-weight="700"
        text-anchor="middle" fill="#FFFFFF">$</text>
</svg>
