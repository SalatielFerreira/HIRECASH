<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>HireCash</title>
    <meta name="description" content="HireCash — gestão de candidatos, dashboard e comissões." />
    <meta name="theme-color" content="#4338ca" />

    <!-- Aplica o tema salvo antes da primeira renderização, para não piscar
         o tema errado por uma fração de segundo (só troca fundo/texto; o
         roxo da marca é sempre o mesmo, veja styles/base/variables.css). -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('hirecash_theme');
          if (saved === 'light' || saved === 'dark') {
            document.documentElement.setAttribute('data-theme', saved);
          }
        } catch (_error) {
          // localStorage indisponível — segue o tema do sistema.
        }
      })();
    </script>

    <!-- iOS/Safari não segue o manifest.webmanifest para modo "app instalado";
         estas tags cobrem o comportamento equivalente no iPhone/iPad. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="HireCash" />
    <meta name="mobile-web-app-capable" content="yes" />

    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="./icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="./styles/main.css" />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <svg
          class="topbar__facets"
          viewBox="0 0 1200 100"
          preserveAspectRatio="none"
          aria-hidden="true"
          focusable="false"
        >
          <g fill="#000">
            <path d="M-260 0H40L600 140Z" opacity=".38" />
            <path d="M40 0h150L600 140Z" opacity=".26" />
            <path d="M190 0h140L600 140Z" opacity=".14" />
            <path d="M425 0h90L600 140Z" opacity=".08" />
            <path d="M660 0h100L600 140Z" opacity=".11" />
            <path d="M880 0h130L600 140Z" opacity=".16" />
            <path d="M1140 0h320L600 140Z" opacity=".09" />
            <path d="M0 0h330L140 100H0Z" opacity=".20" />
            <path d="M0 0h190L60 100H0Z" opacity=".18" />
            <path d="M1010 0h190v100H930Z" opacity=".07" />
          </g>
          <g fill="#fff">
            <path d="M330 0h95L600 140Z" opacity=".07" />
            <path d="M515 0h70L600 140Z" opacity=".15" />
            <path d="M585 0h75L600 140Z" opacity=".05" />
            <path d="M760 0h120L600 140Z" opacity=".08" />
            <path d="M1010 0h130L600 140Z" opacity=".06" />
            <path d="M0 66l255 34H0Z" opacity=".10" />
            <path d="M700 0h90L610 100h-90Z" opacity=".07" />
          </g>
        </svg>
        <span class="topbar__badge">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="3" y="7" width="18" height="13" rx="2" />
            <path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
            <path d="M3 12h18" />
          </svg>
        </span>
        <h1 class="topbar__title">Hire<span>Cash</span></h1>
      </header>

      <div id="alert-region" class="alert-region" aria-live="assertive"></div>
      <div id="banner-region" class="banner-region" aria-live="polite"></div>

      <main id="app-content" class="app-content" aria-live="polite"></main>

      <nav class="bottomnav" aria-label="Navegação principal">
        <a href="#/candidato" class="nav-item" data-route="candidato" aria-current="false">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="8" r="4" />
            <path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8" />
          </svg>
          <span class="nav-item__label">Candidato</span>
        </a>

        <a href="#/dashboard" class="nav-item" data-route="dashboard" aria-current="false">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="3" y="3" width="7" height="9" rx="1.5" />
            <rect x="14" y="3" width="7" height="5" rx="1.5" />
            <rect x="14" y="12" width="7" height="9" rx="1.5" />
            <rect x="3" y="16" width="7" height="5" rx="1.5" />
          </svg>
          <span class="nav-item__label">Dashboard</span>
        </a>

        <a href="#/comissao" class="nav-item" data-route="comissao" aria-current="false">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="7.5" cy="7.5" r="2.5" />
            <circle cx="16.5" cy="16.5" r="2.5" />
            <path d="M6 18 18 6" />
          </svg>
          <span class="nav-item__label">Comissão</span>
        </a>

        <a href="#/configuracao" class="nav-item" data-route="configuracao" aria-current="false">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="12" r="3" />
            <path
              d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82A1.65 1.65 0 0 0 3 13.09H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"
            />
          </svg>
          <span class="nav-item__label">Configuração</span>
        </a>
      </nav>
    </div>

    <script type="module" src="./scripts/app.js"></script>
  </body>
</html>
